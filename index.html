<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Crave Kitchen</title>
<meta name="theme-color" content="#2E5B41">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Crave Kitchen">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --paper:#FAF6EC; --line:#DDD3B8; --ink:#262019; --ink-soft:#6B5F4C;
    --green:#2E5B41; --green-soft:#E4EEE3; --clay:#A8503A; --clay-soft:#F4E4DC;
    --card:#FFFFFF; --shadow:rgba(38,32,25,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#1B1712; --line:#3A3226; --ink:#EFE7D8; --ink-soft:#B3A78F;
      --green:#6FAE86; --green-soft:#223228; --clay:#D98468; --clay-soft:#35251F;
      --card:#241F18; --shadow:rgba(0,0,0,.35); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
    padding:14px 10px 60px; line-height:1.5; }
  .wrap { max-width:960px; margin:0 auto; }
  header { margin-bottom:10px; border-bottom:2px solid var(--ink); padding-bottom:10px; }
  h1 { font-family:Georgia,"Noto Serif Devanagari",serif; font-size:22px; margin:0; }
  .tabs { display:flex; gap:8px; margin:10px 0 14px; overflow-x:auto; }
  .tab-btn { flex:1; min-width:150px; font-size:14px; font-weight:700; padding:10px 14px;
    border:1px solid var(--line); border-radius:9px; background:var(--card); color:var(--ink-soft); cursor:pointer; }
  .tab-btn.active { background:var(--green); color:#fff; border-color:var(--green); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }
  .stock-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:0 0 14px; }
  .stock-stat { background:var(--green-soft); border-radius:9px; padding:10px; text-align:center; }
  .stock-stat .label { font-size:11px; color:var(--ink-soft); font-weight:700; }
  .stock-stat .value { font-size:20px; font-weight:800; margin-top:2px; }
  .stock-stat.earn { grid-column:1/-1; }
  .stock-stat.earn .value { color:var(--green); font-size:24px; }
  @media (max-width:640px) { .stock-summary { grid-template-columns:repeat(2,1fr); } }

  .top-row { display:grid; grid-template-columns: 1fr 220px; gap:12px; margin:14px 0; align-items:stretch; }
  @media (max-width: 640px) { .top-row { grid-template-columns: 1fr; } }

  .cash-card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .cash-card label { font-weight:700; font-size:14px; display:block; margin-bottom:6px; }
  .cash-card input[type="date"] { font-size:16px; font-weight:700; padding:8px 10px;
    border:1.5px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); width:100%; margin-bottom:10px; }
  .cash-card input[type="number"] { font-size:18px; font-weight:700; padding:9px 10px;
    border:1.5px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); width:100%; }
  .cash-status { font-size:12.5px; color:var(--green); min-height:16px; margin-top:6px; }
  .cash-status.err { color:var(--clay); }

  .leftover-card { background:var(--green-soft); border-radius:10px; padding:14px; text-align:center;
    display:flex; flex-direction:column; justify-content:center; }
  .leftover-card.neg { background:var(--clay-soft); }
  .leftover-label { font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-bottom:4px; }
  .leftover-value { font-size:28px; font-weight:800; color:var(--green); font-variant-numeric:tabular-nums; }
  .leftover-card.neg .leftover-value { color:var(--clay); }
  .leftover-sub { font-size:11px; color:var(--ink-soft); margin-top:4px; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:16px; margin-bottom:16px; box-shadow:0 1px 3px var(--shadow); }
  .card h2 { font-family:Georgia,"Noto Serif Devanagari",serif; font-size:17px; margin:0 0 4px; }
  .card .hint { color:var(--ink-soft); font-size:12.5px; margin:0 0 12px; }

  table { width:100%; border-collapse:collapse; font-size:14px; }
  thead th { text-align:left; font-size:11.5px; color:var(--ink-soft); font-weight:700;
    border-bottom:1.5px solid var(--ink); padding:6px 4px; }
  tbody td { padding:7px 4px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .name-cell { font-weight:600; }
  .table-scroll { overflow-x:auto; }
  .earn-cell { font-weight:800; color:var(--green); }

  input[type="number"], input[type="text"] { font-size:15px; font-variant-numeric:tabular-nums;
    padding:6px 8px; border:1.5px solid var(--line); border-radius:6px; background:var(--paper);
    color:var(--ink); width:90px; }
  input[type="text"].wide { width:100%; }
  input:focus { outline:2px solid var(--clay); outline-offset:1px; }

  .total-row td { border-top:2px solid var(--ink); border-bottom:none; padding-top:12px;
    font-weight:700; font-size:15.5px; }
  .total-row .num { color:var(--clay); }

  button.primary { font-size:14px; font-weight:700; padding:11px 18px; border-radius:8px;
    border:none; background:var(--green); color:#fff; cursor:pointer; margin-top:12px; width:100%; }
  button.whatsapp-btn { font-size:14px; font-weight:800; padding:11px 18px; border-radius:8px;
    border:none; background:#25D366; color:#fff; cursor:pointer; margin-top:10px; width:100%; }
  .whatsapp-hint { font-size:12px; color:var(--ink-soft); margin-top:6px; }
  button.secondary { font-size:13px; font-weight:600; padding:7px 14px; border-radius:20px;
    border:1px solid var(--line); background:var(--green-soft); color:var(--green); cursor:pointer; }
  button.icon-btn { background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:2px 6px; }
  button.icon-btn.danger { color:var(--clay); }
  button.chip { font-size:12px; padding:4px 10px; border-radius:14px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink-soft); cursor:pointer; }
  button.chip.on { background:var(--green); color:#fff; border-color:var(--green); }

  .save-status { font-size:12.5px; color:var(--green); margin-top:8px; min-height:16px; }
  .save-status.err { color:var(--clay); }

  .add-form { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .master-manage { margin-top:14px; border-top:1px dashed var(--line); padding-top:12px; }
  .master-manage summary { cursor:pointer; font-size:13px; color:var(--green); font-weight:700; }
  .master-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:6px 0; }
  .muted { color:var(--ink-soft); }
  .warn { color:var(--clay); font-size:12.5px; margin:8px 0 0; }

  html { -webkit-text-size-adjust:100%; }
  body { min-height:100vh; padding:
    max(10px, env(safe-area-inset-top))
    8px
    max(70px, env(safe-area-inset-bottom))
    8px; }
  button, input { min-height:44px; }
  input[type="number"], input[type="text"], input[type="date"] { font-size:16px; }
  .wrap { width:100%; max-width:760px; }
  header { position:sticky; top:0; z-index:20; background:var(--paper);
    padding-top:4px; margin-bottom:8px; }
  header h1 { font-size:20px; }
  .top-row { grid-template-columns:1fr; gap:8px; margin:8px 0; }
  .cash-card, .leftover-card, .card { border-radius:12px; }
  .tabs { position:sticky; top:50px; z-index:19; background:var(--paper);
    padding:6px 0; margin:0 0 8px; }
  .tab-btn { min-width:0; padding:10px 8px; font-size:13px; }
  .table-scroll { margin-left:-4px; margin-right:-4px; }
  table { min-width:620px; }
  table.stock-table { min-width:860px; }
  .stock-summary { grid-template-columns:repeat(2,1fr); }
  .stock-stat { padding:9px 6px; }
  .stock-stat .value { font-size:18px; }
  .stock-stat.earn .value { font-size:24px; }
  button.primary, button.whatsapp-btn { min-height:48px; }
  .add-form { display:grid; grid-template-columns:1fr 1fr auto; }
  .add-form input { width:100% !important; min-width:0; }
  .add-form button { min-width:70px; }
  .master-row { min-height:48px; }
  @media (max-width:430px) {
    .add-form { grid-template-columns:1fr; }
    .add-form button { width:100%; }
    .cash-card input[type="number"] { font-size:20px; }
    .leftover-value { font-size:25px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <h1>Crave Kitchen</h1>
      <button id="installBtn" class="secondary" style="display:none;padding:7px 10px;">📲 Install</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="hisabTab">📋 सामान हिसाब</button>
    <button class="tab-btn" data-tab="stockTab">📦 बना / बिका / बचा</button>
  </div>

  <div id="hisabTab" class="tab-panel active">
  <div class="top-row">
    <div class="cash-card">
      <label for="mainDate">तारीख</label>
      <input type="date" id="mainDate">
      <label for="cashInput">आज कितना कैश आया ₹</label>
      <input type="number" id="cashInput" min="0" step="1" placeholder="0">
      <p class="cash-status" id="cashStatus"></p>
    </div>
    <div class="leftover-card" id="leftoverCard">
      <div class="leftover-label">बचा पैसा (सामान लाने के लिए)</div>
      <div class="leftover-value" id="leftoverValue">…</div>
      <div class="leftover-sub" id="leftoverSub"></div>
    </div>
  </div>

  <div id="sections"></div>
  <div class="card">
    <button class="whatsapp-btn" id="whatsappFullBtn">📲 WhatsApp पर आज का पूरा हिसाब भेजें</button>
    <p class="whatsapp-hint">सामान, खर्च, कैश और स्टॉक का पूरा साफ-साफ संदेश बनेगा।</p>
  </div>
  </div>

  <div id="stockTab" class="tab-panel">
    <div class="card" id="stockCard"><p class="muted">लोड हो रहा है…</p></div>
  </div>
</div>

<script>
  // यहाँ अपने Apps Script डिप्लॉयमेंट का Web app URL डालो
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxfbXIxB67r8No6xIIVlJ8jU6wTFl0wXYgE8k7ocv39iair5yNpIsN1URATatIuGrE1Q/exec";

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  function todayStr() { const d=new Date(); const tz=d.getTimezoneOffset()*60000; return new Date(d-tz).toISOString().slice(0,10); }
  function money(v){ return "₹"+Math.round(Number(v)||0).toLocaleString("en-IN"); }
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  let jsonpCounter = 0;
  function jsonp(params) {
    return new Promise((resolve, reject) => {
      const cbName = "jsonp_cb_" + (jsonpCounter++);
      const timeout = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, 15000);
      function cleanup(){ clearTimeout(timeout); delete window[cbName]; if (script.parentNode) script.parentNode.removeChild(script); }
      window[cbName] = (data) => { cleanup(); resolve(data); };
      const qp = Object.assign({}, params, { callback: cbName, _t: Date.now() });
      Object.keys(qp).forEach(k => { if (typeof qp[k] === "object") qp[k] = JSON.stringify(qp[k]); });
      const qs = new URLSearchParams(qp).toString();
      const script = document.createElement("script");
      script.src = SCRIPT_URL + "?" + qs;
      script.onerror = () => { cleanup(); reject(new Error("network")); };
      document.body.appendChild(script);
    });
  }
  // ---- स्पीड: पूरा दिन एक ही कॉल में मँगवाओ, बाकी सब कॉल इसी से जवाब पाएँगी ----
  const BOOT_TTL_MS = 30000;
  const bootCache = {};   // date -> { t, p }
  function bootFor(date) {
    const c = bootCache[date];
    if (c && Date.now() - c.t < BOOT_TTL_MS) return c.p;
    const p = jsonp({ action: "getBootstrap", date }).then(r => {
      if (!r || r.error || !r.items) throw new Error("bootstrap unavailable");
      return r;
    });
    bootCache[date] = { t: Date.now(), p };
    p.catch(() => { if (bootCache[date] && bootCache[date].p === p) delete bootCache[date]; });
    return p;
  }
  function clearBoot() { Object.keys(bootCache).forEach(k => delete bootCache[k]); }
  function fromBoot(b, action, params, d) {
    switch (action) {
      case "getItems": return { items: (b.items[params.section] || []) };
      case "getEntries": return { entries: (b.entries[params.section] || []) };
      case "getCash": return { cash: b.cash || 0 };
      case "getStockItems": return { items: b.stockItems || [] };
      case "getStockEntries":
        if (params.date === d) return { entries: b.stockEntries || [] };
        if (params.date === prevDateStr(d)) return { entries: b.stockPrevEntries || [] };
        return null;
    }
    return null;
  }
  const BOOT_READS = /^(getItems|getEntries|getCash|getStockItems|getStockEntries)$/;

  async function call(action, extra) {
    const params = Object.assign({ action }, extra || {});
    if (BOOT_READS.test(action)) {
      const d = currentDate();
      try {
        const b = await bootFor(d);
        const r = fromBoot(b, action, params, d);
        if (r) return r;
      } catch (e) { /* पुराना backend हो या कॉल फेल हो तो नीचे वाला सीधा रास्ता चलेगा */ }
    }
    if (params.payload) params.payload = JSON.stringify(params.payload);
    if (/^(save|add|toggle|delete)/.test(action)) clearBoot();
    const result = await jsonp(params);
    if (/^(save|add|toggle|delete)/.test(action)) clearBoot();
    if (/^(save|add|toggle|delete)/.test(action) && result && result.ok === false) {
      throw new Error(result.error || "सेव नहीं हो पाया");
    }
    return result;
  }
  function safeCall(action, extra) { return call(action, extra).catch(() => null); }

  const SECTIONS = [
    { key: "daily", title: "Daily का सामान" },
    { key: "momos", title: "मोमोज़ बनाने का सामान" },
    { key: "packing", title: "Packing" }
  ];

  document.getElementById("mainDate").value = todayStr();
  function currentDate() { return document.getElementById("mainDate").value || todayStr(); }

  let sectionTotals = { daily: 0, momos: 0, packing: 0 };

  function updateLeftover() {
    const cash = parseFloat(document.getElementById("cashInput").value) || 0;
    const totalExpense = sectionTotals.daily + sectionTotals.momos + sectionTotals.packing;
    const leftover = cash - totalExpense;
    const card = document.getElementById("leftoverCard");
    const val = document.getElementById("leftoverValue");
    const sub = document.getElementById("leftoverSub");
    val.textContent = money(Math.abs(leftover));
    card.classList.toggle("neg", leftover < 0);
    sub.textContent = leftover < 0 ? "कमी है" : "कुल खर्च: " + money(totalExpense);
  }

  async function loadCash() {
    const date = currentDate();
    try {
      const c = await call("getCash", { date });
      document.getElementById("cashInput").value = c.cash || "";
    } catch (e) {}
    updateLeftover();
  }
  let cashSaveTimer = null;
  function scheduleCashSave() {
    clearTimeout(cashSaveTimer);
    const statusEl = document.getElementById("cashStatus");
    cashSaveTimer = setTimeout(async () => {
      const date = currentDate();
      const cash = parseFloat(document.getElementById("cashInput").value) || 0;
      statusEl.textContent = "सेव हो रहा है…"; statusEl.classList.remove("err");
      try { await call("saveCash", { payload: { date, cash } }); statusEl.textContent = "✓ सेव हो गया"; }
      catch (e) { statusEl.textContent = "⚠ " + e.message; statusEl.classList.add("err"); }
    }, 600);
  }
  document.getElementById("cashInput").addEventListener("input", () => { updateLeftover(); scheduleCashSave(); });
  document.getElementById("mainDate").addEventListener("change", () => { loadCash(); renderAllSections(); renderStock(); });

  async function renderAllSections() {
    const container = document.getElementById("sections");
    container.innerHTML = SECTIONS.map(s => `<div class="card" id="card-${s.key}"><p class="muted">लोड हो रहा है…</p></div>`).join("");
    await Promise.all(SECTIONS.map(s => renderSection(s.key, s.title)));
    updateLeftover();
  }

  async function renderSection(section, title) {
    const date = currentDate();
    const cardEl = document.getElementById("card-" + section);
    let masterRes, entriesRes;
    try {
      [masterRes, entriesRes] = await Promise.all([
        call("getItems", { section }), call("getEntries", { section, date })
      ]);
    } catch (e) {
      cardEl.innerHTML = `<h2>${esc(title)}</h2><p class="warn">⚠ लोड नहीं हो पाया।</p>
        <button class="secondary" id="retry-${section}">फिर कोशिश करें</button>`;
      document.getElementById("retry-" + section).addEventListener("click", () => renderSection(section, title));
      return;
    }
    const items = (masterRes.items || []).filter(it => it.active);
    const existing = {};
    (entriesRes.entries || []).forEach(e => { existing[e.itemId] = e; });

    let rows = items.map(it => {
      const ex = existing[it.id];
      return `<tr data-id="${it.id}" data-unit="${esc(it.unit)}">
        <td class="name-cell">${esc(it.name)}<div class="muted" style="font-size:11px;">${esc(it.unit)}</div></td>
        <td class="num"><input type="number" class="qty-input" min="0" step="0.01" value="${ex?ex.quantity:''}" placeholder="0"></td>
        <td class="num"><input type="number" class="rate-input" min="0" step="0.01" value="${(ex && ex.rate) ? ex.rate : (it.rate || '')}" placeholder="0"></td>
        <td class="num row-total">₹0</td>
      </tr>`;
    }).join("");

    cardEl.innerHTML = `
      <h2>${esc(title)}</h2>
      <p class="hint">मात्रा और कीमत डालो, कुल अपने आप बन जाएगा।</p>
      <div class="table-scroll">
        <table>
          <thead><tr><th>सामान</th><th class="num">मात्रा</th><th class="num">₹/यूनिट</th><th class="num">कुल ₹</th></tr></thead>
          <tbody id="body-${section}">${rows || '<tr><td colspan="4" class="muted">कोई सक्रिय आइटम नहीं है।</td></tr>'}</tbody>
          <tfoot><tr class="total-row"><td colspan="3">कुल</td><td class="num" id="total-${section}">₹0</td></tr></tfoot>
        </table>
      </div>
      <button class="primary" id="save-${section}">सेव करें</button>
      <p class="save-status" id="status-${section}"></p>

      <details class="master-manage">
        <summary>+ नया सामान जोड़ें / सूची बदलें</summary>
        <div class="add-form">
          <input type="text" id="newName-${section}" placeholder="नाम" class="wide" style="flex:2;">
          <input type="text" id="newUnit-${section}" placeholder="यूनिट (किलो/पीस)" style="flex:1;">
          <button class="secondary" id="addBtn-${section}">जोड़ें</button>
        </div>
        <div id="masterList-${section}" style="margin-top:12px;"></div>
      </details>`;

    const body = document.getElementById("body-" + section);
    function recalc() {
      let total = 0;
      body.querySelectorAll("tr[data-id]").forEach(tr => {
        const qty = parseFloat(tr.querySelector(".qty-input").value) || 0;
        const rate = parseFloat(tr.querySelector(".rate-input").value) || 0;
        tr.querySelector(".row-total").textContent = money(qty * rate);
        total += qty * rate;
      });
      document.getElementById("total-" + section).textContent = money(total);
      sectionTotals[section] = total;
      updateLeftover();
    }
    body.querySelectorAll("input").forEach(inp => inp.addEventListener("input", recalc));
    recalc();

    document.getElementById("save-" + section).addEventListener("click", async () => {
      const statusEl = document.getElementById("status-" + section);
      statusEl.textContent = "सेव हो रहा है…"; statusEl.classList.remove("err");
      const entries = [];
      body.querySelectorAll("tr[data-id]").forEach(tr => {
        entries.push({
          itemId: tr.getAttribute("data-id"),
          itemName: tr.querySelector(".name-cell").childNodes[0].textContent.trim(),
          quantity: parseFloat(tr.querySelector(".qty-input").value) || 0,
          unit: tr.getAttribute("data-unit"),
          rate: parseFloat(tr.querySelector(".rate-input").value) || 0
        });
      });
      try {
        await call("saveEntries", { section, payload: { date, entries } });
        statusEl.textContent = "✓ सेव हो गया";
      } catch (e) { statusEl.textContent = "⚠ " + e.message; statusEl.classList.add("err"); }
    });

    renderMasterManage(section, masterRes.items || []);
    document.getElementById("addBtn-" + section).addEventListener("click", async () => {
      const name = document.getElementById("newName-" + section).value.trim();
      const unit = document.getElementById("newUnit-" + section).value.trim();
      if (!name || !unit) { alert("नाम और यूनिट दोनों भरें"); return; }
      await call("addItem", { section, payload: { name, unit } });
      renderSection(section, title);
    });
  }

  function renderMasterManage(section, items) {
    const el = document.getElementById("masterList-" + section);
    if (!el) return;
    el.innerHTML = items.map(it => `
      <div class="master-row">
        <span>${esc(it.name)} <span class="muted">(${esc(it.unit)})</span> ${it.active ? '' : '<span class="muted">— बंद</span>'}</span>
        <span>
          <button class="chip ${it.active?'on':''}" data-toggle="${it.id}">${it.active?'सक्रिय':'बंद'}</button>
          <button class="icon-btn danger" data-del="${it.id}">हटाएं</button>
        </span>
      </div>`).join("");
    el.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", async () => {
      await call("toggleItem", { payload: { id: b.getAttribute("data-toggle") } });
      renderAllSections();
    }));
    el.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("ये आइटम पूरी तरह हटा दें?")) return;
      await call("deleteItem", { payload: { id: b.getAttribute("data-del") } });
      renderAllSections();
    }));
  }

  loadCash();
  renderAllSections();
  renderStock();

  // ===================================================================
  // मोमोज़ स्टॉक — आज कितने बने, कितने बचे, ₹/प्लेट, पीस/प्लेट → कमाई
  // कमाई = (बिके पीस ÷ पीस/प्लेट) × ₹/प्लेट   (पीस/प्लेट खाली हो तो 1 माना जाएगा)
  // ===================================================================

  function prevDateStr(dateStr) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() - 1);
    const tz = d.getTimezoneOffset() * 60000;
    return new Date(d - tz).toISOString().slice(0, 10);
  }

  function earnOf(sold, pcs, rate) {
    const p = Number(pcs) > 0 ? Number(pcs) : 1;
    return Math.max(Number(sold) || 0, 0) / p * (Number(rate) || 0);
  }

  async function sendFullWhatsApp() {
    const btn = document.getElementById("whatsappFullBtn");
    btn.textContent = "⏳ पूरा हिसाब तैयार हो रहा है…";
    btn.disabled = true;

    try {
      const date = currentDate();

      const [cashRes, dailyRes, momosRes, packingRes, stockRes, stockPrevRes, stockItemsRes] =
        await Promise.all([
          call("getCash", { date }),
          call("getEntries", { section: "daily", date }),
          call("getEntries", { section: "momos", date }),
          call("getEntries", { section: "packing", date }),
          call("getStockEntries", { date }),
          safeCall("getStockEntries", { date: prevDateStr(date) }),
          call("getStockItems")
        ]);

      const money = v => "₹" + Math.round(Number(v) || 0).toLocaleString("en-IN");
      const sectionText = (title, res) => {
        const arr = res.entries || [];
        let total = 0;
        const out = ["📦 *" + title + "*"];
        if (!arr.length) {
          out.push("• कोई एंट्री नहीं");
          return { text: out.join("\n"), total: 0 };
        }
        arr.forEach(e => {
          const qty = Number(e.quantity) || 0;
          const rate = Number(e.rate) || 0;
          const lineTotal = Number(e.total) || qty * rate;
          total += lineTotal;
          out.push("• " + e.itemName + ": " + qty + " " + (e.unit || "") +
                   " × " + money(rate) + " = " + money(lineTotal));
        });
        out.push("• *कुल: " + money(total) + "*");
        return { text: out.join("\n"), total };
      };

      const daily = sectionText("Daily का सामान", dailyRes);
      const momos = sectionText("Momos बनाने का सामान", momosRes);
      const packing = sectionText("Packing", packingRes);

      const cash = Number(cashRes.cash) || 0;
      const expense = daily.total + momos.total + packing.total;
      const cashLeft = cash - expense;

      const prevMap = {};
      (stockPrevRes && stockPrevRes.entries || []).forEach(e => prevMap[e.itemId] = Number(e.leftover) || 0);
      const stockMap = {};
      (stockRes.entries || []).forEach(e => stockMap[e.itemId] = e);

      const stockItems = (stockItemsRes.items || []).filter(it => it.active);
      let made = 0, sold = 0, leftover = 0, available = 0, earned = 0;
      const stockLines = ["📦 *आज का बना / बिका / बचा स्टॉक*"];

      if (!stockItems.length) {
        stockLines.push("• कोई स्टॉक आइटम नहीं");
      } else {
        stockItems.forEach(it => {
          const e = stockMap[it.id];
          const prev = prevMap[it.id] || 0;
          const m = e ? Number(e.made) || 0 : 0;
          const l = e ? Number(e.leftover) || 0 : 0;
          const r = e ? Number(e.rate) || 0 : 0;
          const pcs = e ? Number(e.pcsPerPlate) || 0 : 0;
          const a = prev + m;
          const s = a - l;
          const earn = earnOf(s, pcs, r);

          made += m; sold += s; leftover += l; available += a; earned += earn;

          stockLines.push("• *" + it.name + "*");
          stockLines.push("  कल बचा: " + prev + " " + it.unit);
          stockLines.push("  आज बना: " + m + " " + it.unit);
          stockLines.push("  कुल उपलब्ध: " + a + " " + it.unit);
          stockLines.push("  आज बिका: " + s + " " + it.unit);
          stockLines.push("  आज बचा: " + l + " " + it.unit);
          if (r) stockLines.push("  ₹/प्लेट: " + money(r) + (pcs ? " (" + pcs + " पीस/प्लेट)" : ""));
          stockLines.push("  💰 आज की कमाई: " + money(earn));
        });
      }

      const lines = [
        "📋 *Crave Kitchen — आज का पूरा हिसाब*",
        "📅 *तारीख:* " + date,
        "",
        daily.text,
        "",
        momos.text,
        "",
        packing.text,
        "",
        "💰 *कैश और खर्च*",
        "• आज का कैश: " + money(cash),
        "• कुल सामान खर्च: " + money(expense),
        "• बचा पैसा: " + money(cashLeft),
        "",
        stockLines.join("\n"),
        "",
        "📊 *स्टॉक का कुल*",
        "• आज बना: " + made,
        "• कुल उपलब्ध: " + available,
        "• आज बिका: " + sold,
        "• आज बचा: " + leftover,
        "• 💰 आज की कमाई (बिक्री): " + money(earned),
        "",
        "✅ हिसाब Crave Kitchen WebApp से बनाया गया है।"
      ];

      const url = "https://wa.me/?text=" + encodeURIComponent(lines.join("\n"));
      window.open(url, "_blank");
    } catch (e) {
      alert("पूरा WhatsApp हिसाब तैयार नहीं हो पाया: " + e.message);
    } finally {
      btn.textContent = "📲 WhatsApp पर आज का पूरा हिसाब भेजें";
      btn.disabled = false;
    }
  }

  document.getElementById("whatsappFullBtn").addEventListener("click", sendFullWhatsApp);

  async function renderStock() {
    const date = currentDate();
    const cardEl = document.getElementById("stockCard");
    cardEl.innerHTML = '<p class="muted">लोड हो रहा है…</p>';
    let masterRes, entriesRes, prevRes;
    try {
      [masterRes, entriesRes, prevRes] = await Promise.all([
        call("getStockItems"), call("getStockEntries", { date }),
        safeCall("getStockEntries", { date: prevDateStr(date) })
      ]);
    } catch (e) {
      cardEl.innerHTML = `<h2>बना / बिका / बचा स्टॉक</h2><p class="warn">⚠ लोड नहीं हो पाया।</p>
        <button class="secondary" id="retry-stock">फिर कोशिश करें</button>`;
      document.getElementById("retry-stock").addEventListener("click", renderStock);
      return;
    }
    const items = (masterRes.items || []).filter(it => it.active);
    const existing = {};
    (entriesRes.entries || []).forEach(e => { existing[e.itemId] = e; });
    const prevLeftover = {};
    const prevRate = {};
    const prevPcs = {};
    ((prevRes && prevRes.entries) || []).forEach(e => {
      prevLeftover[e.itemId] = e.leftover;
      prevRate[e.itemId] = e.rate;
      prevPcs[e.itemId] = e.pcsPerPlate;
    });

    let rows = items.map(it => {
      const ex = existing[it.id];
      const yesterday = prevLeftover[it.id] || 0;
      // आज का रेट/पीस सेव है तो वही, वरना कल का अपने-आप भर जाएगा (बदलना हो तो बदल सकते हो)
      const rateVal = ex ? (ex.rate || '') : (prevRate[it.id] || '');
      const pcsVal = ex ? (ex.pcsPerPlate || '') : (prevPcs[it.id] || '');
      return `<tr data-id="${it.id}" data-prev="${yesterday}">
        <td class="name-cell">${esc(it.name)}<div class="muted" style="font-size:11px;">${esc(it.unit)}</div></td>
        <td class="num" style="color:var(--ink-soft);">${yesterday}</td>
        <td class="num"><input type="number" class="made-input" min="0" step="1" value="${ex?ex.made:''}" placeholder="0"></td>
        <td class="num available-cell">0</td>
        <td class="num"><input type="number" class="leftover-input" min="0" step="1" value="${ex?ex.leftover:''}" placeholder="0"></td>
        <td class="num sold-cell">0</td>
        <td class="num"><input type="number" class="pcs-input" min="1" step="1" value="${pcsVal}" placeholder="10"></td>
        <td class="num"><input type="number" class="rate-input" min="0" step="0.01" value="${rateVal}" placeholder="0"></td>
        <td class="num earn-cell">₹0</td>
      </tr>`;
    }).join("");

    cardEl.innerHTML = `
      <h2>मोमोज़ स्टॉक</h2>
      <p class="hint">${esc(date)} — कल का बचा स्टॉक अपने-आप आएगा। आज कितने बने और दिन के अंत में कितने बचे भरो। कमाई निकालने के लिए पीस/प्लेट और ₹/प्लेट डालो (कमाई = बिके ÷ पीस/प्लेट × ₹/प्लेट)।</p>
      <div class="stock-summary">
        <div class="stock-stat"><div class="label">आज बने</div><div class="value" id="stockMadeTotal">0</div></div>
        <div class="stock-stat"><div class="label">कुल उपलब्ध</div><div class="value" id="stockAvailableTotal">0</div></div>
        <div class="stock-stat"><div class="label">आज बचे</div><div class="value" id="stockLeftoverTotal">0</div></div>
        <div class="stock-stat"><div class="label">आज बिके</div><div class="value" id="stockSoldTotal">0</div></div>
        <div class="stock-stat earn"><div class="label">💰 आज की कमाई</div><div class="value" id="stockEarnTotal">₹0</div></div>
      </div>
      <div class="table-scroll">
        <table class="stock-table">
          <thead><tr><th>आइटम</th><th class="num">कल बचे</th><th class="num">आज बने</th><th class="num">कुल उपलब्ध</th><th class="num">आज बचे</th><th class="num">आज बिके</th><th class="num">पीस/प्लेट</th><th class="num">₹/प्लेट</th><th class="num">कमाई ₹</th></tr></thead>
          <tbody id="stockBody">${rows || '<tr><td colspan="9" class="muted">कोई सक्रिय आइटम नहीं है।</td></tr>'}</tbody>
        </table>
      </div>
      <button class="primary" id="saveStockBtn">सेव करें</button>
      <button class="whatsapp-btn" id="whatsappStockBtn">📲 WhatsApp पर आज का पूरा हिसाब भेजें</button>
      <p class="whatsapp-hint">पहले सेव करें, फिर WhatsApp बटन दबाकर पूरा हिसाब शेयर करें।</p>
      <p class="save-status" id="stockStatus"></p>

      <div class="master-manage">
        <div style="font-weight:800;color:var(--green);font-size:15px;margin-bottom:8px;">
          ➕ नया आइटम जोड़ें
        </div>
        <p class="hint" style="margin-bottom:8px;">
          जैसे: Paneer Momos, Veg Momos, Spring Roll, Burger आदि।
        </p>
        <div class="add-form">
          <input type="text" id="newStockName" placeholder="आइटम का नाम" class="wide" style="flex:2;">
          <input type="text" id="newStockUnit" placeholder="यूनिट: पीस / प्लेट / किलो" style="flex:1;">
          <button class="secondary" id="addStockBtn" style="white-space:nowrap;">+ जोड़ें</button>
        </div>
        <div id="stockAddStatus" class="save-status"></div>
        <div style="font-weight:700;margin-top:12px;font-size:13px;">आइटम की सूची</div>
        <div id="stockMasterList" style="margin-top:6px;"></div>
      </div>`;

    const body = document.getElementById("stockBody");
    function recalcStock() {
      let madeTotal = 0, availableTotal = 0, leftoverTotal = 0, soldTotal = 0, earnTotal = 0;
      body.querySelectorAll("tr[data-id]").forEach(tr => {
        const prev = parseFloat(tr.getAttribute("data-prev")) || 0;
        const made = parseFloat(tr.querySelector(".made-input").value) || 0;
        const leftover = parseFloat(tr.querySelector(".leftover-input").value) || 0;
        const pcs = parseFloat(tr.querySelector(".pcs-input").value) || 0;
        const rate = parseFloat(tr.querySelector(".rate-input").value) || 0;
        const available = prev + made;
        const sold = available - leftover;
        const earn = earnOf(sold, pcs, rate);
        tr.querySelector(".available-cell").textContent = available;
        tr.querySelector(".sold-cell").textContent = sold;
        tr.querySelector(".earn-cell").textContent = money(earn);
        madeTotal += made;
        availableTotal += available;
        leftoverTotal += leftover;
        soldTotal += sold;
        earnTotal += earn;
      });
      const set = (id, value) => {
        const el = document.getElementById(id);
        if (el) el.textContent = value;
      };
      set("stockMadeTotal", madeTotal);
      set("stockAvailableTotal", availableTotal);
      set("stockLeftoverTotal", leftoverTotal);
      set("stockSoldTotal", soldTotal);
      set("stockEarnTotal", money(earnTotal));
    }
    recalcStock();
    body.querySelectorAll("tr[data-id]").forEach(tr => {
      tr.querySelectorAll("input").forEach(inp => inp.addEventListener("input", recalcStock));
    });

    document.getElementById("saveStockBtn").addEventListener("click", async () => {
      const statusEl = document.getElementById("stockStatus");
      statusEl.textContent = "सेव हो रहा है…"; statusEl.classList.remove("err");
      const entries = [];
      body.querySelectorAll("tr[data-id]").forEach(tr => {
        entries.push({
          itemId: tr.getAttribute("data-id"),
          itemName: tr.querySelector(".name-cell").childNodes[0].textContent.trim(),
          made: parseFloat(tr.querySelector(".made-input").value) || 0,
          leftover: parseFloat(tr.querySelector(".leftover-input").value) || 0,
          rate: parseFloat(tr.querySelector(".rate-input").value) || 0,
          pcsPerPlate: parseFloat(tr.querySelector(".pcs-input").value) || 0
        });
      });
      try {
        await call("saveStockEntries", { payload: { date, entries } });
        statusEl.textContent = "✓ सेव हो गया";
      } catch (e) { statusEl.textContent = "⚠ " + e.message; statusEl.classList.add("err"); }
    });

    document.getElementById("whatsappStockBtn").addEventListener("click", async () => {
      const btn = document.getElementById("whatsappStockBtn");
      btn.textContent = "⏳ हिसाब तैयार हो रहा है…";
      btn.disabled = true;

      try {
        // बैकएंड से ताज़ा सेव डेटा लो ताकि मैसेज में सेव की हुई वैल्यू जाएँ
        const latest = await call("getStockEntries", { date });
        const saved = {};
        (latest.entries || []).forEach(e => { saved[e.itemId] = e; });

        const lines = [];
        lines.push("📋 *Crave Kitchen — आज का स्टॉक हिसाब*");
        lines.push("📅 तारीख: " + date);
        lines.push("");

        let totalMade = 0, totalAvailable = 0, totalLeftover = 0, totalSold = 0, totalEarn = 0;
        let hasData = false;

        items.forEach(it => {
          const e = saved[it.id];
          const prev = prevLeftover[it.id] || 0;
          const made = e ? Number(e.made) || 0 : 0;
          const leftover = e ? Number(e.leftover) || 0 : 0;
          const rate = e ? Number(e.rate) || 0 : 0;
          const pcs = e ? Number(e.pcsPerPlate) || 0 : 0;
          const available = prev + made;
          const sold = available - leftover;
          const earn = earnOf(sold, pcs, rate);

          if (made || leftover || prev) hasData = true;

          totalMade += made;
          totalAvailable += available;
          totalLeftover += leftover;
          totalSold += sold;
          totalEarn += earn;

          lines.push("🔹 *" + it.name + "*");
          lines.push("   • कल बचा: " + prev + " " + it.unit);
          lines.push("   • आज बना: " + made + " " + it.unit);
          lines.push("   • कुल उपलब्ध: " + available + " " + it.unit);
          lines.push("   • आज बिका: " + sold + " " + it.unit);
          lines.push("   • आज बचा: " + leftover + " " + it.unit);
          if (rate) lines.push("   • ₹/प्लेट: ₹" + Math.round(rate * 100) / 100 + (pcs ? " (" + pcs + " पीस/प्लेट)" : ""));
          lines.push("   • 💰 कमाई: " + money(earn));
          lines.push("");
        });

        lines.push("📊 *कुल हिसाब*");
        lines.push("• आज बना: " + totalMade);
        lines.push("• कुल उपलब्ध: " + totalAvailable);
        lines.push("• आज बिका: " + totalSold);
        lines.push("• आज बचा: " + totalLeftover);
        lines.push("• 💰 आज की कमाई (बिक्री): " + money(totalEarn));
        lines.push("");
        lines.push("✅ हिसाब Crave Kitchen WebApp से बनाया गया है।");

        if (!hasData) {
          lines.splice(3, 0, "⚠️ आज अभी कोई स्टॉक एंट्री नहीं है।");
          lines.push("");
        }

        const message = lines.join("\n");
        const url = "https://wa.me/?text=" + encodeURIComponent(message);
        window.open(url, "_blank");

      } catch (e) {
        alert("WhatsApp हिसाब तैयार नहीं हो पाया: " + e.message);
      } finally {
        btn.textContent = "📲 WhatsApp पर आज का पूरा हिसाब भेजें";
        btn.disabled = false;
      }
    });

    const mm = document.getElementById("stockMasterList");
    mm.innerHTML = (masterRes.items || []).map(it => `
      <div class="master-row">
        <span>${esc(it.name)} <span class="muted">(${esc(it.unit)})</span> ${it.active ? '' : '<span class="muted">— बंद</span>'}</span>
        <span>
          <button class="chip ${it.active?'on':''}" data-toggle="${it.id}">${it.active?'सक्रिय':'बंद'}</button>
          <button class="icon-btn danger" data-del="${it.id}">हटाएं</button>
        </span>
      </div>`).join("");
    mm.querySelectorAll("[data-toggle]").forEach(b => b.addEventListener("click", async () => {
      await call("toggleStockItem", { payload: { id: b.getAttribute("data-toggle") } });
      renderStock();
    }));
    mm.querySelectorAll("[data-del]").forEach(b => b.addEventListener("click", async () => {
      if (!confirm("ये आइटम पूरी तरह हटा दें?")) return;
      await call("deleteStockItem", { payload: { id: b.getAttribute("data-del") } });
      renderStock();
    }));
    document.getElementById("addStockBtn").addEventListener("click", async () => {
      const nameEl = document.getElementById("newStockName");
      const unitEl = document.getElementById("newStockUnit");
      const statusEl = document.getElementById("stockAddStatus");
      const name = nameEl.value.trim();
      const unit = unitEl.value.trim() || "पीस";

      if (!name) {
        statusEl.textContent = "⚠ पहले आइटम का नाम डालो";
        statusEl.classList.add("err");
        nameEl.focus();
        return;
      }

      statusEl.textContent = "जोड़ रहा हूँ…";
      statusEl.classList.remove("err");

      try {
        await call("addStockItem", { payload: { name, unit } });
        nameEl.value = "";
        unitEl.value = "";
        statusEl.textContent = "✓ " + name + " जोड़ दिया गया";
        setTimeout(renderStock, 250);
      } catch (e) {
        statusEl.textContent = "⚠ " + e.message;
        statusEl.classList.add("err");
      }
    });
  }

  // PWA install: Android Chrome will show the Install button when the app
  // is served from HTTPS with the manifest + service worker files.
  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const b = document.getElementById("installBtn");
    if (b) b.style.display = "block";
  });
  const installBtn = document.getElementById("installBtn");
  if (installBtn) {
    installBtn.addEventListener("click", async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = "none";
    });
  }
  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
  }

</script>
</body>
</html>
