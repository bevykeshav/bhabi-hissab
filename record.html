<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Crave Kitchen — रिकॉर्ड</title>
<meta name="theme-color" content="#1F6B4F">
<style>
  :root {
    --bg:#F2F5F3; --card:#FFFFFF; --ink:#14201C; --soft:#5A6B64; --line:#D9E1DD;
    --cash:#1F6B4F; --online:#2A5CA3; --exp:#B03F2E; --tint:#E8EFEB; --warn:#B03F2E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0F1613; --card:#17211D; --ink:#E8F0EC; --soft:#97A8A0; --line:#2A3832;
      --cash:#6FCB9F; --online:#7FB0F0; --exp:#F09A88; --tint:#1F2D27; --warn:#F09A88;
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;
    line-height:1.45;
    padding:0 10px max(40px, env(safe-area-inset-bottom));
  }
  .wrap { max-width:720px; margin:0 auto; }

  header {
    padding:max(14px, env(safe-area-inset-top)) 2px 10px;
    display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap;
  }
  h1 { margin:0; font-size:20px; font-weight:800; letter-spacing:-.2px; }
  .lock { font-size:12px; color:var(--soft); }

  .panel {
    background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px;
  }
  .dates { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dates label { display:block; font-size:12px; font-weight:700; color:var(--soft); margin-bottom:3px; }
  .dates input {
    width:100%; min-height:44px; font-size:16px; font-weight:700; padding:8px 10px;
    border:1.5px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink);
  }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip {
    min-height:38px; padding:6px 13px; font-size:13px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); border-radius:19px; background:var(--bg); color:var(--soft);
  }
  .chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .chip:focus-visible, .dates input:focus-visible { outline:2px solid var(--online); outline-offset:2px; }
  .status { min-height:20px; margin:10px 2px 4px; font-size:13px; color:var(--soft); }
  .status.err { color:var(--warn); }

  /* बही-खाता: तारीख | कैश | ऑनलाइन | खर्च */
  .ledger { margin-top:6px; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .row {
    display:grid; grid-template-columns:minmax(78px,1.15fr) 1fr 1fr 1fr; gap:6px; align-items:start;
    padding:10px 12px; border-bottom:1px solid var(--line);
  }
  .row:last-child { border-bottom:none; }
  .row.head { background:var(--tint); padding-top:8px; padding-bottom:8px; font-size:12px; font-weight:700; color:var(--soft); }
  .row.total { background:var(--tint); font-weight:800; border-bottom:2px solid var(--ink); }
  .row .n { text-align:right; font-variant-numeric:tabular-nums; font-size:14px; font-weight:700; white-space:nowrap; }
  .row.head .n { font-weight:700; font-size:12px; }
  .c-cash { color:var(--cash); }
  .c-online { color:var(--online); }
  .c-exp { color:var(--exp); }
  .d { font-weight:700; font-size:14px; }
  .d small { display:block; font-weight:500; font-size:11.5px; color:var(--soft); }
  .d .fest { color:var(--exp); font-weight:600; }
  .n small { display:block; font-weight:600; font-size:10.5px; color:var(--soft); }
  .n small.s-cash { color:var(--cash); }
  .n small.s-onl { color:var(--online); }
  .row.day { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .row.day:focus-visible { outline:2px solid var(--online); outline-offset:-2px; }
  .d .tap { color:var(--online); font-weight:600; }
  .det { grid-column:1 / -1; display:none; margin-top:6px; padding:8px 10px; background:var(--tint); border-radius:8px; }
  .row.open .det { display:block; }
  .det-line { display:flex; justify-content:space-between; gap:8px; padding:4px 0; border-bottom:1px dashed var(--line); font-size:12.5px; }
  .det-line:last-child { border-bottom:none; }
  .det-line b { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .tag { display:inline-block; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:8px; margin-left:4px; }
  .tag.cash { background:var(--card); color:var(--cash); border:1px solid var(--cash); }
  .tag.onl { background:var(--card); color:var(--online); border:1px solid var(--online); }
  .sec-name { color:var(--soft); font-size:11px; }
  .empty { padding:22px 14px; text-align:center; color:var(--soft); font-size:14px; }
  .foot { margin:12px 2px 0; font-size:12px; color:var(--soft); }
  @media (max-width:380px) { .row .n { font-size:13px; } .row { padding:9px 8px; gap:4px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Crave Kitchen — रिकॉर्ड</h1>
    <span class="lock">🔒 सिर्फ़ देखने के लिए</span>
  </header>

  <div class="panel">
    <div class="dates">
      <div><label for="from">से</label><input type="date" id="from"></div>
      <div><label for="to">तक</label><input type="date" id="to"></div>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-r="today">आज</button>
      <button class="chip" data-r="week">पिछले 7 दिन</button>
      <button class="chip on" data-r="month">इस महीने</button>
      <button class="chip" data-r="lastmonth">पिछला महीना</button>
    </div>
    <div class="chips" style="margin-top:8px;">
      <button class="chip on" id="sortNew">नई तारीख़ पहले</button>
      <button class="chip" id="sortOld">पुरानी तारीख़ पहले</button>
    </div>
  </div>

  <p class="status" id="status"></p>
  <div id="out"></div>
  <p class="foot">कैश = उस दिन हाथ में आया पैसा · ऑनलाइन = UPI/ऑनलाइन आया पैसा · खर्च = सामान पर कुल खर्च, जिसके नीचे दिखता है कि कितना कैश से और कितना ऑनलाइन हुआ। किसी तारीख़ पर दबाओ तो हर सामान और उसका कैश/ऑनलाइन दिखेगा।</p>
</div>

<script>
  // वही Apps Script URL जो Crave Kitchen ऐप में है। ये ऐप इससे सिर्फ़ पढ़ता है, कुछ लिखता या बदलता नहीं।
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwxfbXIxB67r8No6xIIVlJ8jU6wTFl0wXYgE8k7ocv39iair5yNpIsN1URATatIuGrE1Q/exec";

  const WD = ["रवि","सोम","मंगल","बुध","गुरु","शुक्र","शनि"];
  let data = null;
  let newestFirst = true;

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const money = v => "₹" + Math.round(Number(v) || 0).toLocaleString("en-IN");
  const ymd = d => { const z = d.getTimezoneOffset() * 60000; return new Date(d - z).toISOString().slice(0, 10); };

  function fmtDay(s) {
    const d = new Date(s + "T12:00:00");
    if (isNaN(d)) return { main: s, sub: "" };
    const p = s.split("-");
    return { main: p[2] + "-" + p[1] + "-" + p[0].slice(2), sub: WD[d.getDay()] };
  }

  // सिर्फ़ पढ़ने वाली कॉल (JSONP, action = getRangeSummary)
  function readRange(from, to) {
    return new Promise((resolve, reject) => {
      const cb = "cb_" + Date.now();
      const timer = setTimeout(() => { clean(); reject(new Error("जवाब नहीं आया, दोबारा कोशिश करो")); }, 20000);
      const s = document.createElement("script");
      function clean() { clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
      window[cb] = r => { clean(); resolve(r); };
      s.onerror = () => { clean(); reject(new Error("इंटरनेट या सर्वर की दिक्कत")); };
      s.src = SCRIPT_URL + "?" + new URLSearchParams({ action: "getRangeSummary", from, to, callback: cb, _t: Date.now() });
      document.body.appendChild(s);
    });
  }

  function setRange(kind) {
    const now = new Date();
    let from = new Date(now), to = new Date(now);
    if (kind === "week") from.setDate(now.getDate() - 6);
    else if (kind === "month") from = new Date(now.getFullYear(), now.getMonth(), 1);
    else if (kind === "lastmonth") {
      from = new Date(now.getFullYear(), now.getMonth() - 1, 1);
      to = new Date(now.getFullYear(), now.getMonth(), 0);
    }
    $("from").value = ymd(from);
    $("to").value = ymd(to);
  }

  function render() {
    const out = $("out");
    if (!data) { out.innerHTML = ""; return; }
    const days = (data.days || []).slice().sort((a, b) => newestFirst ? (a.date < b.date ? 1 : -1) : (a.date < b.date ? -1 : 1));
    const t = data.totals || {};
    const fest = data.festivals || {};

    if (!days.length) {
      out.innerHTML = '<div class="ledger"><div class="empty">इन तारीख़ों में कोई एंट्री नहीं मिली।</div></div>';
      return;
    }

    // हर तारीख़ का सामान: कौन सा कैश से आया, कौन सा ऑनलाइन
    const SEC = { daily: "Daily", momos: "मोमोज़ सामान", packing: "Packing" };
    const byDate = {};
    ["daily", "momos", "packing"].forEach(sec => {
      ((data.items && data.items[sec]) || []).forEach(it => {
        (it.days || []).forEach(x => {
          (byDate[x.date] = byDate[x.date] || []).push({ sec: SEC[sec], name: it.name, unit: it.unit || "", qty: x.qty, rate: x.rate, amount: x.amount, online: !!x.online });
        });
      });
    });
    const qty = v => String(Math.round((Number(v) || 0) * 100) / 100);
    const split = (exp, onl) => {
      const o = Number(onl) || 0;
      return '<small class="s-cash">कैश से ' + money((Number(exp) || 0) - o) + '</small>' +
             (o ? '<small class="s-onl">ऑनलाइन ' + money(o) + '</small>' : '');
    };

    const rows = days.map(d => {
      const f = fmtDay(d.date);
      const list = byDate[d.date] || [];
      const lines = list.map(x => `<div class="det-line">
          <span>${esc(x.name)}<span class="tag ${x.online ? 'onl' : 'cash'}">${x.online ? 'ऑनलाइन' : 'कैश'}</span>
            <div class="sec-name">${esc(x.sec)} · ${qty(x.qty)} ${esc(x.unit)} × ${money(x.rate)}</div></span>
          <b>${money(x.amount)}</b></div>`).join("");
      return `<div class="row day" tabindex="0" role="button" aria-expanded="false">
        <div class="d">${esc(f.main)}<small>${esc(f.sub)}</small>${fest[d.date] ? '<small class="fest">' + esc(fest[d.date]) + '</small>' : ''}${list.length ? '<small class="tap">सामान देखें ▾</small>' : ''}</div>
        <div class="n c-cash">${money(d.cash)}</div>
        <div class="n c-online">${money(d.online)}</div>
        <div class="n c-exp">${money(d.expense)}${split(d.expense, d.onlineExp)}</div>
        ${list.length ? '<div class="det">' + lines + '</div>' : ''}
      </div>`;
    }).join("");

    out.innerHTML = `<div class="ledger">
      <div class="row head"><div>तारीख़</div><div class="n">कैश</div><div class="n">ऑनलाइन</div><div class="n">खर्च</div></div>
      <div class="row total">
        <div class="d">कुल<small>${days.length} दिन</small></div>
        <div class="n c-cash">${money(t.cash)}</div>
        <div class="n c-online">${money(t.online)}</div>
        <div class="n c-exp">${money(t.expense)}${split(t.expense, t.onlineExp)}</div>
      </div>
      ${rows}
    </div>`;
  }

  async function load() {
    const from = $("from").value, to = $("to").value || from;
    if (!from) return;
    const st = $("status");
    st.className = "status"; st.textContent = "⏳ रिकॉर्ड आ रहा है…";
    try {
      const r = await readRange(from, to);
      if (!r || r.error || !r.totals) throw new Error(r && r.error ? r.error : "बैकएंड से जवाब ठीक नहीं आया");
      data = r;
      st.textContent = "";
      render();
    } catch (e) {
      data = null; render();
      st.className = "status err"; st.textContent = "⚠ " + e.message;
    }
  }

  function markChip(kind) {
    document.querySelectorAll("#chips .chip").forEach(c => c.classList.toggle("on", c.dataset.r === kind));
  }
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    setRange(b.dataset.r); markChip(b.dataset.r); load();
  });
  ["from", "to"].forEach(id => $(id).addEventListener("change", () => { markChip(""); load(); }));
  $("sortNew").addEventListener("click", () => { newestFirst = true; $("sortNew").classList.add("on"); $("sortOld").classList.remove("on"); render(); });
  $("sortOld").addEventListener("click", () => { newestFirst = false; $("sortOld").classList.add("on"); $("sortNew").classList.remove("on"); render(); });

  function toggleRow(row) {
    const open = row.classList.toggle("open");
    row.setAttribute("aria-expanded", open ? "true" : "false");
    const tap = row.querySelector(".tap");
    if (tap) tap.textContent = open ? "बंद करें ▴" : "सामान देखें ▾";
  }
  $("out").addEventListener("click", e => { const r = e.target.closest(".row.day"); if (r) toggleRow(r); });
  $("out").addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const r = e.target.closest(".row.day"); if (r) { e.preventDefault(); toggleRow(r); }
  });

  setRange("month");
  load();
</script>
</body>
</html>
